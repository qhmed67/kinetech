name: CI

on:
  push:
    branches: [main, feat/react-native]
  pull_request:
    branches: [main, feat/react-native]

# Least privilege: the jobs only check out the code. If a job ever needs more
# (an artifact upload, a comment, a release), grant it in that job only.
permissions:
  contents: read

jobs:
  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA (the tag is in the comment) so the action
      # cannot be swapped for another one without a review of this file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  public-surface:
    name: Public surface
    runs-on: ubuntu-latest
    steps:
      # No setup-node needed: the guard is a plain bash script.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Fails the build if a credential, a real infrastructure identifier or an
      # owner-only document would become public. Values are never printed:
      # only "path:line:type". The optional blocklist of real identifiers lives
      # in the platform's secret store, one literal per line.
      - run: bash scripts/check-public-surface.sh
        env:
          PUBLIC_SURFACE_BLOCKLIST: ${{ secrets.PUBLIC_SURFACE_BLOCKLIST }}
