<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="signinTitle">Sign in · KineTech</title>
<meta name="description" content="Sign in to your KineTech account." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=Valley+Sans:wght@100..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>
<main class="auth auth-roomy">
<div aria-labelledby="signin-h">
<a class="brandmark" href="/"><img src="assets/logo.png" data-i18n-alt="backAlt" alt="KineTech home" /></a>
<h1 id="signin-h" data-i18n="inH1">Welcome back!</h1>
<p class="sub" data-i18n="inSub">We empower developers and technical teams to create, simulate, and manage AI-driven workflows visually</p>
<form id="signinForm" action="#">
<div class="field">
<label for="email" data-i18n="email">Email</label>
<input id="email" name="email" type="email" data-i18n-ph="emailPh" placeholder="youremail@yourdomain.com" autocomplete="email" required />
</div>
<div class="field">
<label for="password" data-i18n="pw">Password</label>
<input id="password" name="password" type="password" data-i18n-ph="pwPh" placeholder="Create a password" autocomplete="current-password" required />
</div>
<p id="authErr" role="alert" hidden style="color:#B3261E;font-size:14px;font-weight:700"></p>
<button class="primary" id="submitBtn" type="submit" data-i18n="inSubmit">Sign in</button>
</form>
<p class="foot"><span data-i18n="inFootPre">Already have an account? </span><a href="signup.html" data-i18n="inFootLink">Sign up</a></p>
</div>
<aside class="panel" aria-label="KineTech"><a class="brandlock panel-brand" href="/"><img class="logo-img" src="assets/logo.png" width="48" height="48" alt="KineTech home" style="width:48px;height:48px" /><span class="wordmark"><span class="k">KINE</span><span class="t">TECH</span></span></a></aside>
</main>
<div class="msl" id="msl" hidden role="status" aria-live="polite">
<div class="msl-box"><div class="msl-list" id="mslList"></div></div>
<div class="msl-fade"></div>
</div>
<script src="auth-lang.js"></script>
<script src="supabase-config.js"></script>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.47.0";
// Runtime-injected, never committed. Deploy must provide supabase-config.js.
const sb = createClient(window.__SUPABASE_URL__, window.__SUPABASE_ANON_KEY__);
const COOLDOWN_MS = 3000;
let lastTry = 0;
let busy = false;
const errBox = document.getElementById('authErr');
const btn = document.getElementById('submitBtn');
function withTimeout(p, ms, label) {
  let t;
  const timeout = new Promise(function(_, rej) { t = setTimeout(function() { rej(new Error(label + ' timed out — check your connection and retry.')); }, ms); });
  return Promise.race([p, timeout]).finally(function() { clearTimeout(t); });
}
const NET_TIMEOUT = 15000;
function fail(msg) {
  errBox.textContent = msg || 'Sign-in failed. Check your email and password.';
  errBox.hidden = false;
}
document.getElementById('signinForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const now = Date.now();
  if (busy || now - lastTry < COOLDOWN_MS) return;
  lastTry = now;
  errBox.hidden = true;
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  if (!email || !pw) return;
  busy = true;
  btn.disabled = true;
  try {
    const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password: pw }), NET_TIMEOUT, 'Sign-in');
    if (error || !data.user) throw error || new Error('login failed');
    const uid = data.user.id;
    // Complete a pending signup (email-confirmation flow): create profile if absent.
    let profile = null;
    try {
      const r = await withTimeout(sb.from('profiles').select('id,email,name,phone').eq('id', uid).single(), NET_TIMEOUT, 'Profile check');
      profile = r.data || null;
    } catch (err) { profile = null; }
    if (!profile) {
      let pending = null;
      try { pending = JSON.parse(window.sessionStorage.getItem('kt-pending-signup') || 'null'); } catch (err) { pending = null; }
      if (pending && pending.email === email) {
        await withTimeout(sb.from('profiles').insert({
          id: uid, email, name: pending.name, phone: pending.phone || null,
          national_id: pending.nationalId || null, grade: pending.grade || null,
        }), NET_TIMEOUT, 'Profile setup');
        await withTimeout(sb.from('user_tracks').insert({ user_id: uid, track: pending.track }), NET_TIMEOUT, 'Track setup');
        try { window.sessionStorage.removeItem('kt-pending-signup'); } catch (err) {}
        profile = { name: pending.name, phone: pending.phone || '' };
      }
    }
    const nm = (profile && profile.name) || email.split('@')[0].replace(/[._-]+/g, ' ').trim() || 'Student';
    const ph = (profile && profile.phone) || '';
    // Local cache of the VERIFIED session only (no mock enrollments — server decides).
    try {
      window.localStorage.setItem('kt-user', JSON.stringify({ name: nm, email, phone: ph, enrolled: [], tracks: [] }));
    } catch (err) {}
    window.location.href = '/#/dashboard';
  } catch (err) {
    fail(err && err.message ? err.message : undefined);
    busy = false;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
